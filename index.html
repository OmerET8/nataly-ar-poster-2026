<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AR Academic Poster — MindAR</title>
  
  <!-- A-Frame library (v1.5.0) -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <!-- MindAR A-Frame extension (v1.2.5) -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: transparent !important;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    /* Fullscreen AR Scene & Canvas */
    a-scene {
      width: 100vw;
      height: 100vh;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 2;
    }

    .a-canvas {
      position: absolute !important;
      top: 0 !important;
      left: 0 !important;
      width: 100% !important;
      height: 100% !important;
      z-index: 2 !important;
    }

    /* MindAR camera feed layer */
    body > video:not(#video1):not(#video2) {
      position: absolute !important;
      top: 0 !important;
      left: 0 !important;
      width: 100% !important;
      height: 100% !important;
      object-fit: cover !important;
      z-index: 1 !important;
      display: block !important;
    }

    /* UI Overlay Layer */
    .ar-ui-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 10;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 1.25rem 1rem;
    }

    /* Top Bar Status - High opacity RGBA avoids heavy mobile backdrop-filter blur */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
    }
    .status-badge {
      background: rgba(15, 23, 42, 0.90);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 0.5rem 0.9rem;
      border-radius: 9999px;
      color: #f8fafc;
      font-size: 0.82rem;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
    }
    .pulse-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #38bdf8;
      box-shadow: 0 0 6px #38bdf8;
      animation: pulse 1.6s infinite;
      will-change: transform, opacity;
    }
    .pulse-dot.active {
      background: #10b981;
      box-shadow: 0 0 8px #10b981;
    }
    @keyframes pulse {
      0% { transform: scale(0.9); opacity: 0.6; }
      50% { transform: scale(1.3); opacity: 1; }
      100% { transform: scale(0.9); opacity: 0.6; }
    }

    .info-btn {
      pointer-events: auto;
      background: rgba(15, 23, 42, 0.90);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #f8fafc;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-weight: bold;
    }

    /* Scanning Reticle Frame */
    .scan-guide {
      align-self: center;
      width: 78vw;
      max-width: 340px;
      aspect-ratio: 16 / 9;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.3s ease, transform 0.3s ease;
      will-change: opacity, transform;
    }
    .scan-guide.hidden {
      opacity: 0;
      transform: scale(1.05);
      pointer-events: none;
    }

    .corner {
      position: absolute;
      width: 22px;
      height: 22px;
      border-color: #38bdf8;
      border-style: solid;
    }
    .corner-tl { top: 0; left: 0; border-width: 3px 0 0 3px; border-top-left-radius: 6px; }
    .corner-tr { top: 0; right: 0; border-width: 3px 3px 0 0; border-top-right-radius: 6px; }
    .corner-bl { bottom: 0; left: 0; border-width: 0 0 3px 3px; border-bottom-left-radius: 6px; }
    .corner-br { bottom: 0; right: 0; border-width: 0 3px 3px 0; border-bottom-right-radius: 6px; }

    /* Performance optimization: Hardware-accelerated GPU transform instead of 'top' */
    .scan-line {
      position: absolute;
      width: 100%;
      height: 2px;
      background: linear-gradient(90deg, transparent, #38bdf8, transparent);
      box-shadow: 0 0 8px #38bdf8;
      top: 0;
      animation: scanAnim 2.2s ease-in-out infinite alternate;
      will-change: transform;
    }
    @keyframes scanAnim {
      0% { transform: translateY(0); opacity: 0.2; }
      50% { opacity: 0.9; }
      100% { transform: translateY(180px); opacity: 0.2; }
    }

    .guide-text {
      background: rgba(15, 23, 42, 0.90);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 0.45rem 0.85rem;
      border-radius: 20px;
      color: #e2e8f0;
      font-size: 0.82rem;
      font-weight: 500;
      text-align: center;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
    }

    /* Bottom Control Bar */
    .bottom-bar {
      display: flex;
      justify-content: center;
      gap: 0.75rem;
      width: 100%;
      pointer-events: auto;
    }
    .ui-chip {
      background: rgba(15, 23, 42, 0.90);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #94a3b8;
      font-size: 0.75rem;
      padding: 0.35rem 0.75rem;
      border-radius: 9999px;
      font-weight: 500;
    }

    /* Splash Screen */
    .splash-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #090d16;
      z-index: 100;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      text-align: center;
      transition: opacity 0.4s ease;
    }
    .splash-screen.fade-out {
      opacity: 0;
      pointer-events: none;
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 3px solid rgba(56, 189, 248, 0.2);
      border-top-color: #38bdf8;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 1.5rem;
      will-change: transform;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .splash-title {
      font-size: 1.35rem;
      font-weight: 700;
      color: #f8fafc;
      margin-bottom: 0.5rem;
    }
    .splash-desc {
      color: #94a3b8;
      font-size: 0.9rem;
      max-width: 320px;
      line-height: 1.5;
    }

    /* Error Modal */
    .error-modal {
      display: none;
      background: rgba(30, 41, 59, 0.98);
      border: 1px solid #ef4444;
      border-radius: 12px;
      padding: 1.25rem;
      max-width: 340px;
      color: #f8fafc;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      margin-top: 1.5rem;
    }
    .error-modal h3 { color: #ef4444; font-size: 1.1rem; margin-bottom: 0.4rem; }
    .error-modal p { font-size: 0.85rem; color: #cbd5e1; margin-bottom: 1rem; line-height: 1.4; }
    .modal-btn {
      background: #2563eb;
      color: white;
      border: none;
      padding: 0.6rem 1.2rem;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
    }
  </style>
</head>
<body>

  <!-- Loading Splash Screen -->
  <div class="splash-screen" id="splashScreen">
    <div class="spinner"></div>
    <h2 class="splash-title">Initializing WebAR</h2>
    <p class="splash-desc">Requesting camera access and loading tracking features...</p>

    <div class="error-modal" id="missingTargetModal">
      <h3>Target File Notice</h3>
      <p id="targetErrorMessage">Unable to load targets or access camera.</p>
      <a href="compiler.html" class="modal-btn">Open Compiler</a>
    </div>
  </div>

  <!-- UI Overlay -->
  <div class="ar-ui-overlay">
    <div class="top-bar">
      <div class="status-badge">
        <span class="pulse-dot" id="statusDot"></span>
        <span id="statusLabel">AR Scanning Active</span>
      </div>
      <button class="info-btn" onclick="alert('Point camera at Figure 1 or Figure 2 on the conference poster.')">?</button>
    </div>

    <div class="scan-guide" id="scanGuide">
      <div class="corner corner-tl"></div>
      <div class="corner corner-tr"></div>
      <div class="corner corner-bl"></div>
      <div class="corner corner-br"></div>
      <div class="scan-line"></div>
      <div class="guide-text">Aim camera at Figure 1 or 2</div>
    </div>

    <div class="bottom-bar">
      <span class="ui-chip">MindAR Multi-Track (2 Targets)</span>
      <span class="ui-chip">Hardware Accelerated</span>
    </div>
  </div>

  <!--
    Optimizations applied to a-scene:
    1. uiLoading/uiScanning/uiError: "no" disables redundant MindAR default DOM creation.
    2. renderer="antialias: false; alpha: true; precision: mediump; powerPreference: high-performance;" disables expensive MSAA on mobile.
    3. filterMinCF & filterBeta tuned for responsiveness vs jitter.
  -->
  <a-scene
    id="arScene"
    mindar-image="imageTargetSrc: ./assets/targets.mind; maxTrack: 2; filterMinCF: 0.001; filterBeta: 10; warmupTolerance: 3; missTolerance: 5; uiLoading: no; uiScanning: no; uiError: no;"
    renderer="antialias: false; alpha: true; precision: mediump; powerPreference: high-performance;"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <!-- Use preload="metadata" to prevent memory exhaustion and network stalls -->
    <a-assets timeout="8000">
      <video
        id="video1"
        src="./assets/video1.mp4"
        preload="metadata"
        loop="true"
        playsinline
        webkit-playsinline
        muted
        crossorigin="anonymous">
      </video>

      <video
        id="video2"
        src="./assets/video2.mp4"
        preload="metadata"
        loop="true"
        playsinline
        webkit-playsinline
        muted
        crossorigin="anonymous">
      </video>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- Initially visible="false" so Three.js ignores them until tracked -->
    <a-entity id="target0" mindar-image-target="targetIndex: 0" visible="false">
      <a-video
        id="arVideo1"
        src="#video1"
        width="1"
        height="0.5625"
        position="0 0 0"
        rotation="0 0 0">
      </a-video>
    </a-entity>

    <a-entity id="target1" mindar-image-target="targetIndex: 1" visible="false">
      <a-video
        id="arVideo2"
        src="#video2"
        width="1"
        height="0.5625"
        position="0 0 0"
        rotation="0 0 0">
      </a-video>
    </a-entity>
  </a-scene>

  <script>
    const scene = document.querySelector('#arScene');
    const splashScreen = document.querySelector('#splashScreen');
    const statusDot = document.querySelector('#statusDot');
    const statusLabel = document.querySelector('#statusLabel');
    const scanGuide = document.querySelector('#scanGuide');
    const target0 = document.querySelector('#target0');
    const target1 = document.querySelector('#target1');
    const video1 = document.querySelector('#video1');
    const video2 = document.querySelector('#video2');

    let activeTargetsCount = 0;

    // --- CRITICAL PERFORMANCE OPTIMIZATION: DPR CLAMPING ---
    // Clamping device pixel ratio to max 1.5 prevents mobile GPUs from melting on high-DPI screens.
    scene.addEventListener('loaded', () => {
      const renderer = scene.renderer;
      if (renderer) {
        renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.5));
      }
    });

    function triggerHaptic() {
      if (navigator.vibrate) {
        try { navigator.vibrate(30); } catch (e) {}
      }
    }

    function updateUI() {
      if (activeTargetsCount > 0) {
        scanGuide.classList.add('hidden');
        statusDot.classList.add('active');
      } else {
        scanGuide.classList.remove('hidden');
        statusDot.classList.remove('active');
        statusLabel.innerText = "AR Scanning Active";
      }
    }

    scene.addEventListener('arReady', () => {
      splashScreen.classList.add('fade-out');
      setTimeout(() => { splashScreen.style.display = 'none'; }, 400);
    });

    scene.addEventListener('arError', () => {
      const modal = document.querySelector('#missingTargetModal');
      const msg = document.querySelector('#targetErrorMessage');
      modal.style.display = 'block';
      msg.innerHTML = "Camera permission denied or <code>assets/targets.mind</code> missing.<br>Verify assets and reload.";
    });

    video1.muted = true;
    video2.muted = true;

    // Safari iOS audio/video resume safety
    window.addEventListener('touchstart', () => {
      if (video1.paused && activeTargetsCount === 0) video1.load();
      if (video2.paused && activeTargetsCount === 0) video2.load();
    }, { once: true });

    // Target 0 (Figure 1)
    target0.addEventListener('targetFound', () => {
      target0.setAttribute('visible', 'true');
      activeTargetsCount++;
      statusLabel.innerText = "Tracking Figure 1";
      triggerHaptic();
      updateUI();

      video1.currentTime = 0;
      video1.play().catch(() => {});
    });

    target0.addEventListener('targetLost', () => {
      target0.setAttribute('visible', 'false'); // Stops Three.js from uploading and rendering
      activeTargetsCount = Math.max(0, activeTargetsCount - 1);
      video1.pause();
      updateUI();
    });

    // Target 1 (Figure 2)
    target1.addEventListener('targetFound', () => {
      target1.setAttribute('visible', 'true');
      activeTargetsCount++;
      statusLabel.innerText = "Tracking Figure 2";
      triggerHaptic();
      updateUI();

      video2.currentTime = 0;
      video2.play().catch(() => {});
    });

    target1.addEventListener('targetLost', () => {
      target1.setAttribute('visible', 'false'); // Stops Three.js from uploading and rendering
      activeTargetsCount = Math.max(0, activeTargetsCount - 1);
      video2.pause();
      updateUI();
    });
  </script>
</body>
</html>
