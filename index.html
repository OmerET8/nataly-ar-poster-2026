<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>AR Academic Poster — Stabilized WebAR</title>

  <!-- A-Frame library (v1.5.0) -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <!-- MindAR A-Frame extension (v1.2.5) -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000 !important;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    /* Fullscreen AR Scene & Canvas */
    a-scene {
      width: 100vw;
      height: 100dvh;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 2;
    }

    .a-canvas {
      position: absolute !important;
      top: 0 !important;
      left: 0 !important;
      width: 100% !important;
      height: 100% !important;
      z-index: 2 !important;
    }

    /* MindAR camera feed layer */
    body > video:not(#video1):not(#video2) {
      position: absolute !important;
      top: 0 !important;
      left: 0 !important;
      width: 100% !important;
      height: 100% !important;
      object-fit: cover !important;
      z-index: 1 !important;
      display: block !important;
    }

    /* UI Overlay Layer */
    .ar-ui-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100dvh;
      height: 100vh;
      z-index: 10;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 1rem 1rem calc(1.5rem + env(safe-area-inset-bottom, 0px)) 1rem;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      pointer-events: auto;
    }
    .status-badge {
      background: rgba(15, 23, 42, 0.88);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 0.5rem 0.9rem;
      border-radius: 9999px;
      color: #f8fafc;
      font-size: 0.82rem;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
    }
    .pulse-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #38bdf8;
      box-shadow: 0 0 6px #38bdf8;
      animation: pulse 1.6s infinite;
      will-change: transform, opacity;
    }
    .pulse-dot.active {
      background: #10b981;
      box-shadow: 0 0 8px #10b981;
    }
    @keyframes pulse {
      0% { transform: scale(0.9); opacity: 0.6; }
      50% { transform: scale(1.3); opacity: 1; }
      100% { transform: scale(0.9); opacity: 0.6; }
    }

    .info-btn {
      pointer-events: auto;
      background: rgba(15, 23, 42, 0.88);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #f8fafc;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-weight: bold;
    }

    /* Scanning Reticle Frame */
    .scan-guide {
      align-self: center;
      width: 78vw;
      max-width: 340px;
      aspect-ratio: 16 / 9;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.25s ease, transform 0.25s ease;
      will-change: opacity, transform;
    }
    .scan-guide.hidden {
      opacity: 0;
      transform: scale(0.95);
      pointer-events: none;
    }

    .corner {
      position: absolute;
      width: 22px;
      height: 22px;
      border-color: #38bdf8;
      border-style: solid;
    }
    .corner-tl { top: 0; left: 0; border-width: 3px 0 0 3px; border-top-left-radius: 6px; }
    .corner-tr { top: 0; right: 0; border-width: 3px 3px 0 0; border-top-right-radius: 6px; }
    .corner-bl { bottom: 0; left: 0; border-width: 0 0 3px 3px; border-bottom-left-radius: 6px; }
    .corner-br { bottom: 0; right: 0; border-width: 0 3px 3px 0; border-bottom-right-radius: 6px; }

    .scan-line {
      position: absolute;
      width: 100%;
      height: 2px;
      background: linear-gradient(90deg, transparent, #38bdf8, transparent);
      box-shadow: 0 0 8px #38bdf8;
      top: 0;
      animation: scanAnim 2s ease-in-out infinite alternate;
      will-change: transform;
    }
    @keyframes scanAnim {
      0% { transform: translateY(0); opacity: 0.2; }
      50% { opacity: 0.9; }
      100% { transform: translateY(180px); opacity: 0.2; }
    }

    .guide-text {
      background: rgba(15, 23, 42, 0.88);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 0.45rem 0.85rem;
      border-radius: 20px;
      color: #e2e8f0;
      font-size: 0.82rem;
      font-weight: 500;
      text-align: center;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
    }

    /* Bottom Control Bar */
    .bottom-bar {
      display: flex;
      justify-content: center;
      gap: 0.75rem;
      width: 100%;
      pointer-events: auto;
    }
    .ui-chip {
      background: rgba(15, 23, 42, 0.88);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #cbd5e1;
      font-size: 0.75rem;
      padding: 0.45rem 0.85rem;
      border-radius: 9999px;
      font-weight: 500;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
    }

    /* Tap-to-Focus Reticle */
    .focus-ring {
      position: absolute;
      width: 54px;
      height: 54px;
      border: 2px solid #38bdf8;
      border-radius: 8px;
      pointer-events: none;
      transform: translate(-50%, -50%) scale(1.4);
      opacity: 0;
      transition: transform 0.2s ease-out, opacity 0.2s ease-out;
      z-index: 50;
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.5);
    }
    .focus-ring.active {
      transform: translate(-50%, -50%) scale(1);
      opacity: 1;
    }

    /* Splash Screen */
    .splash-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100dvh;
      background: #090d16;
      z-index: 100;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      text-align: center;
      transition: opacity 0.3s ease;
    }
    .splash-screen.fade-out {
      opacity: 0;
      pointer-events: none;
    }
    .spinner {
      width: 44px;
      height: 44px;
      border: 3px solid rgba(56, 189, 248, 0.2);
      border-top-color: #38bdf8;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 1.5rem;
      will-change: transform;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .splash-title {
      font-size: 1.3rem;
      font-weight: 700;
      color: #f8fafc;
      margin-bottom: 0.5rem;
    }
    .splash-desc {
      color: #94a3b8;
      font-size: 0.88rem;
      max-width: 300px;
      line-height: 1.4;
    }

    .error-modal {
      display: none;
      background: rgba(30, 41, 59, 0.98);
      border: 1px solid #ef4444;
      border-radius: 12px;
      padding: 1.25rem;
      max-width: 320px;
      color: #f8fafc;
      text-align: center;
      margin-top: 1.5rem;
    }
    .error-modal h3 { color: #ef4444; font-size: 1.1rem; margin-bottom: 0.4rem; }
    .error-modal p { font-size: 0.85rem; color: #cbd5e1; margin-bottom: 1rem; }
    .modal-btn {
      background: #2563eb;
      color: white;
      border: none;
      padding: 0.55rem 1.1rem;
      border-radius: 6px;
      font-size: 0.85rem;
      text-decoration: none;
      display: inline-block;
    }
  </style>

  <script>
    // --- 1. CAMERA INTERCEPT: 720P @ 60 FPS & CONTINUOUS AUTOFOCUS ---
    let cameraTrack = null;

    if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
      const origGetUserMedia = navigator.mediaDevices.getUserMedia.bind(navigator.mediaDevices);

      navigator.mediaDevices.getUserMedia = async function (constraints) {
        if (constraints && constraints.video) {
          const videoConstraints = typeof constraints.video === 'object' ? constraints.video : {};

          // Request 60 FPS at 720p (prevents heavy 1080p TF.js overhead)
          const enhancedConstraints = {
            ...constraints,
            video: {
              ...videoConstraints,
              facingMode: videoConstraints.facingMode || { ideal: "environment" },
              width: { ideal: 1280 },
              height: { ideal: 720 },
              frameRate: { ideal: 60, min: 30 }
            }
          };

          try {
            const stream = await origGetUserMedia(enhancedConstraints);
            attachTrackControls(stream);
            return stream;
          } catch (err) {
            console.warn("Optimized constraints rejected, falling back:", err);
            const fallbackStream = await origGetUserMedia(constraints);
            attachTrackControls(fallbackStream);
            return fallbackStream;
          }
        }
        return origGetUserMedia(constraints);
      };
    }

    function attachTrackControls(stream) {
      const track = stream.getVideoTracks()[0];
      if (!track) return;
      cameraTrack = track;

      // Lock continuous autofocus if supported on device
      setTimeout(async () => {
        try {
          const caps = track.getCapabilities ? track.getCapabilities() : {};
          const advanced = [];
          if (caps.focusMode && caps.focusMode.includes('continuous')) {
            advanced.push({ focusMode: 'continuous' });
          }
          if (caps.exposureMode && caps.exposureMode.includes('continuous')) {
            advanced.push({ exposureMode: 'continuous' });
          }
          if (advanced.length > 0) {
            await track.applyConstraints({ advanced });
          }
        } catch (e) {}
      }, 500);
    }

    // --- 2. CUSTOM A-FRAME COMPONENT: POSE STABILIZER & HOMOGRAPHY FLIP REJECTION ---
    AFRAME.registerComponent('smooth-anchor', {
      schema: {
        target: { type: 'selector' },
        posLerp: { type: 'number', default: 0.16 },
        rotSlerp: { type: 'number', default: 0.14 },
        maxAngleJump: { type: 'number', default: 0.44 }, // ~25 degrees
        lossGraceMs: { type: 'number', default: 250 }     // Prevents 1-frame blinking
      },

      init: function () {
        this.targetEl = this.data.target;
        this.isTargetFound = false;
        this.lastFoundTime = 0;
        this.firstSeen = true;

        this.currPos = new THREE.Vector3();
        this.currQuat = new THREE.Quaternion();
        this.currScale = new THREE.Vector3(1, 1, 1);

        this.rawPos = new THREE.Vector3();
        this.rawQuat = new THREE.Quaternion();
        this.rawScale = new THREE.Vector3(1, 1, 1);

        if (!this.targetEl) return;

        this.targetEl.addEventListener('targetFound', () => {
          this.isTargetFound = true;
          this.lastFoundTime = performance.now();
        });

        this.targetEl.addEventListener('targetLost', () => {
          this.isTargetFound = false;
        });
      },

      tick: function (time, timeDelta) {
        if (!this.targetEl) return;

        const now = performance.now();
        const targetObj = this.targetEl.object3D;

        // Keep content visible through short tracking dropouts
        const isVisible = this.isTargetFound || (now - this.lastFoundTime < this.data.lossGraceMs);

        if (!isVisible) {
          if (this.el.object3D.visible) {
            this.el.object3D.visible = false;
            this.firstSeen = true;
          }
          return;
        }

        if (this.isTargetFound) {
          this.lastFoundTime = now;
        }

        targetObj.updateMatrixWorld(true);
        targetObj.getWorldPosition(this.rawPos);
        targetObj.getWorldQuaternion(this.rawQuat);
        targetObj.getWorldScale(this.rawScale);

        if (this.firstSeen) {
          this.currPos.copy(this.rawPos);
          this.currQuat.copy(this.rawQuat);
          this.currScale.copy(this.rawScale);
          this.firstSeen = false;
          this.el.object3D.visible = true;
        } else {
          // Normalize lerp/slerp factor across 30-60 FPS
          const dtFactor = Math.min(1.0, Math.max(0.01, (timeDelta || 16.6) / 16.666));
          const pFactor = Math.min(1.0, this.data.posLerp * dtFactor);
          const rFactor = Math.min(1.0, this.data.rotSlerp * dtFactor);

          // Position interpolation
          this.currPos.lerp(this.rawPos, pFactor);

          // Outlier flip detection: Rejects sudden mathematical homography jumps (> 25°)
          const angleDiff = this.currQuat.angleTo(this.rawQuat);
          if (angleDiff < this.data.maxAngleJump) {
            this.currQuat.slerp(this.rawQuat, rFactor);
          }

          // Scale interpolation
          this.currScale.lerp(this.rawScale, pFactor);
        }

        this.el.object3D.position.copy(this.currPos);
        this.el.object3D.quaternion.copy(this.currQuat);
        this.el.object3D.scale.copy(this.currScale);
        this.el.object3D.visible = true;
      }
    });
  </script>
</head>
<body>

  <!-- Loading Splash Screen -->
  <div class="splash-screen" id="splashScreen">
    <div class="spinner"></div>
    <h2 class="splash-title">Initializing WebAR</h2>
    <p class="splash-desc">Stabilizing camera feed and calibrating tracking features...</p>

    <div class="error-modal" id="missingTargetModal">
      <h3>Target File Notice</h3>
      <p id="targetErrorMessage">Unable to load targets or access camera.</p>
      <a href="compiler.html" class="modal-btn">Open Compiler</a>
    </div>
  </div>

  <!-- Tap-to-Focus Reticle -->
  <div class="focus-ring" id="focusRing"></div>

  <!-- UI Overlay -->
  <div class="ar-ui-overlay">
    <div class="top-bar">
      <div class="status-badge">
        <span class="pulse-dot" id="statusDot"></span>
        <span id="statusLabel">AR Scanning Active</span>
      </div>
      <button class="info-btn" onclick="alert('Point camera at Figure 1 or Figure 2 on the conference poster. Tap anywhere on screen to refocus.')">?</button>
    </div>

    <!-- Scan Reticle -->
    <div class="scan-guide" id="scanGuide">
      <div class="corner corner-tl"></div>
      <div class="corner corner-tr"></div>
      <div class="corner corner-bl"></div>
      <div class="corner corner-br"></div>
      <div class="scan-line"></div>
      <div class="guide-text">Align figure inside frame</div>
    </div>

    <!-- Bottom Controls & FPS Meter -->
    <div class="bottom-bar">
      <div class="ui-chip">Tap screen to focus</div>
      <div class="ui-chip" id="fpsBadge">-- FPS</div>
    </div>
  </div>

  <!--
    MINDAR CONFIGURATION:
    - filterMinCF: 0.0001 & filterBeta: 0.001 (CRITICAL: eliminates the shaking seen in the video)
    - missTolerance: 12 (avoids rapid target blinking)
    - warmupTolerance: 2 (fast target recognition)
  -->
  <a-scene
    id="arScene"
    mindar-image="imageTargetSrc: ./assets/targets.mind; maxTrack: 2; filterMinCF: 0.0001; filterBeta: 0.001; warmupTolerance: 2; missTolerance: 12; uiLoading: no; uiScanning: no; uiError: no;"
    renderer="antialias: false; alpha: true; precision: mediump; powerPreference: high-performance; stencil: false; depth: true;"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
    loading-screen="enabled: false">

    <a-assets timeout="10000">
      <video
        id="video1"
        src="./assets/video1.mp4"
        preload="metadata"
        loop="true"
        playsinline
        webkit-playsinline
        muted
        crossorigin="anonymous">
      </video>

      <video
        id="video2"
        src="./assets/video2.mp4"
        preload="metadata"
        loop="true"
        playsinline
        webkit-playsinline
        muted
        crossorigin="anonymous">
      </video>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false" wasd-controls-enabled="false"></a-camera>

    <!-- Raw MindAR Tracker Entities (invisible) -->
    <a-entity id="target0" mindar-image-target="targetIndex: 0" visible="false"></a-entity>
    <a-entity id="target1" mindar-image-target="targetIndex: 1" visible="false"></a-entity>

    <!-- Stabilized Render Entities (isolated from homography flips & jitter) -->
    <a-entity id="anchor0" smooth-anchor="target: #target0" visible="false">
      <a-video
        id="arVideo1"
        src="#video1"
        width="1"
        height="0.5625"
        position="0 0 0"
        rotation="0 0 0"
        material="shader: flat; side: front; transparent: true;">
      </a-video>
    </a-entity>

    <a-entity id="anchor1" smooth-anchor="target: #target1" visible="false">
      <a-video
        id="arVideo2"
        src="#video2"
        width="1"
        height="0.8"
        position="0 0 0"
        rotation="0 0 0"
        material="shader: flat; side: front; transparent: true;">
      </a-video>
    </a-entity>
  </a-scene>

  <script>
    const scene = document.querySelector('#arScene');
    const splashScreen = document.querySelector('#splashScreen');
    const statusDot = document.querySelector('#statusDot');
    const statusLabel = document.querySelector('#statusLabel');
    const scanGuide = document.querySelector('#scanGuide');
    const focusRing = document.querySelector('#focusRing');
    const fpsBadge = document.querySelector('#fpsBadge');

    const target0 = document.querySelector('#target0');
    const target1 = document.querySelector('#target1');
    const arVideo1 = document.querySelector('#arVideo1');
    const arVideo2 = document.querySelector('#arVideo2');
    const video1 = document.querySelector('#video1');
    const video2 = document.querySelector('#video2');

    let isTarget0Tracked = false;
    let isTarget1Tracked = false;

    // --- 3. CLAMP RENDERER PIXEL RATIO ---
    scene.addEventListener('loaded', () => {
      const renderer = scene.renderer;
      if (renderer) {
        renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.0));
      }
    });

    // Automatically sync aspect ratio with the loaded MP4 files
    function syncVideoAspect(videoEl, aVideoEl) {
      const update = () => {
        if (videoEl.videoWidth && videoEl.videoHeight) {
          const aspect = videoEl.videoHeight / videoEl.videoWidth;
          aVideoEl.setAttribute('width', '1');
          aVideoEl.setAttribute('height', aspect.toFixed(4));
        }
      };
      if (videoEl.readyState >= 1) update();
      else videoEl.addEventListener('loadedmetadata', update, { once: true });
    }
    syncVideoAspect(video1, arVideo1);
    syncVideoAspect(video2, arVideo2);

    // --- 4. REAL-TIME FPS MONITOR ---
    let frameTimes = 0;
    let lastFpsUpdate = performance.now();
    function trackFPS(now) {
      frameTimes++;
      if (now - lastFpsUpdate >= 1000) {
        const currentFps = Math.round((frameTimes * 1000) / (now - lastFpsUpdate));
        fpsBadge.innerText = `${currentFps} FPS`;
        frameTimes = 0;
        lastFpsUpdate = now;
      }
      requestAnimationFrame(trackFPS);
    }
    requestAnimationFrame(trackFPS);

    // --- 5. INTERACTIVE TAP-TO-FOCUS CONTROLLER ---
    async function triggerTapFocus(e) {
      if (e.target.closest('.info-btn') || e.target.closest('.modal-btn')) return;

      const clientX = e.clientX || (e.touches && e.touches[0].clientX);
      const clientY = e.clientY || (e.touches && e.touches[0].clientY);

      if (clientX !== undefined && clientY !== undefined) {
        focusRing.style.left = `${clientX}px`;
        focusRing.style.top = `${clientY}px`;
        focusRing.classList.add('active');
        setTimeout(() => focusRing.classList.remove('active'), 450);
      }

      triggerHaptic(25);

      if (!cameraTrack || !cameraTrack.applyConstraints) return;
      try {
        const caps = cameraTrack.getCapabilities ? cameraTrack.getCapabilities() : {};
        const advanced = [];

        if (caps.pointsOfInterest && clientX && clientY) {
          advanced.push({
            pointsOfInterest: [{ x: clientX / window.innerWidth, y: clientY / window.innerHeight }]
          });
        }
        if (caps.focusMode && caps.focusMode.includes('continuous')) {
          advanced.push({ focusMode: 'continuous' });
        }

        if (advanced.length > 0) {
          await cameraTrack.applyConstraints({ advanced });
        }
      } catch (err) {}
    }

    window.addEventListener('click', triggerTapFocus);

    function triggerHaptic(duration = 30) {
      if (navigator.vibrate) {
        try { navigator.vibrate(duration); } catch (e) {}
      }
    }

    function updateStatusUI() {
      if (isTarget0Tracked && isTarget1Tracked) {
        scanGuide.classList.add('hidden');
        statusDot.classList.add('active');
        statusLabel.innerText = "Tracking Figures 1 & 2";
      } else if (isTarget0Tracked) {
        scanGuide.classList.add('hidden');
        statusDot.classList.add('active');
        statusLabel.innerText = "Tracking Figure 1";
      } else if (isTarget1Tracked) {
        scanGuide.classList.add('hidden');
        statusDot.classList.add('active');
        statusLabel.innerText = "Tracking Figure 2";
      } else {
        scanGuide.classList.remove('hidden');
        statusDot.classList.remove('active');
        statusLabel.innerText = "AR Scanning Active";
      }
    }

    scene.addEventListener('arReady', () => {
      splashScreen.classList.add('fade-out');
      setTimeout(() => { splashScreen.style.display = 'none'; }, 300);
    });

    scene.addEventListener('arError', () => {
      const modal = document.querySelector('#missingTargetModal');
      const msg = document.querySelector('#targetErrorMessage');
      modal.style.display = 'block';
      msg.innerHTML = "Camera access denied or <code>assets/targets.mind</code> missing.<br>Please allow camera permissions and reload.";
    });

    video1.muted = true;
    video2.muted = true;

    // Safari iOS autoplay touch unlock
    window.addEventListener('touchstart', () => {
      if (video1.paused && !isTarget0Tracked) video1.load();
      if (video2.paused && !isTarget1Tracked) video2.load();
    }, { once: true });

    // Target 0 (Figure 1)
    target0.addEventListener('targetFound', () => {
      isTarget0Tracked = true;
      triggerHaptic();
      updateStatusUI();

      if (video1.paused) {
        video1.play().catch(() => {});
      }
    });

    target0.addEventListener('targetLost', () => {
      isTarget0Tracked = false;
      setTimeout(() => {
        if (!isTarget0Tracked) video1.pause();
      }, 250);
      updateStatusUI();
    });

    // Target 1 (Figure 2)
    target1.addEventListener('targetFound', () => {
      isTarget1Tracked = true;
      triggerHaptic();
      updateStatusUI();

      if (video2.paused) {
        video2.play().catch(() => {});
      }
    });

    target1.addEventListener('targetLost', () => {
      isTarget1Tracked = false;
      setTimeout(() => {
        if (!isTarget1Tracked) video2.pause();
      }, 250);
      updateStatusUI();
    });
  </script>
</body>
</html>
